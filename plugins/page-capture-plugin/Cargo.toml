[package]
name = "page-capture-plugin"
version.workspace = true
edition.workspace = true
description = "Tauri mobile plugin: renders a page via a real, off-layout Android WebView for capture."
links = "page-capture-plugin"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }

[dependencies]
tauri = "2.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
